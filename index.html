<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới - Bính Ngọ 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Chúc Mừng Năm Mới - Bính Ngọ 2026</h1>
        <div id="countdown">Đang tải đồng hồ đếm ngược...</div>
    </header>

    <main>
        <section class="content">
            <h2>Chào mừng năm con Ngựa!</h2>
            <p>Năm 2026 là năm <strong>Bính Ngọ</strong>, mang biểu tượng của sự tự do, năng động và bứt phá.</p>
            
            <!-- Video -->
            <div class="video-container">
                <h3>Video Không Khí Tết</h3>
                <iframe width="560" height="315" src="www.youtube.com" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- Audio -->
            <div class="audio-container">
                <h3>Nhạc Xuân Sôi Động</h3>
                <audio controls>
                    <source src="www.bensound.com" type="audio/mpeg">
                    Trình duyệt của bạn không hỗ trợ phát âm thanh.
                </audio>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Chào Xuân Bính Ngọ - Tạo bởi GitHub Pages</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
